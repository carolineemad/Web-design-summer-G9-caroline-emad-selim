<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="card">

    <div class="card-inner">
        <div class="card-front">
            <img src="image1.jpg.jpg" alt="">
            <div class="overlay"></div>
            <div class="front-content">
            <h2>Financial Sector Development Program</h2>
            <div class="circle">
                <i class="fa-solid fa-square-arrow-up-right"></i>
            </div>
        </div>
        </div>
        <div class="card-back">
            <img class="logo" src="🦆 icon _map_.png" alt="">
            <h2>Financial Sector Development Program</h2>
            <p>
                The Program aims to develop a diversified and effective financial
                sector to support the development of the Saudi Arabian economy.
            </p>
            <div class="bottom">
                <a href="#">Read More</a>
                <div class="circle">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </div>
        </div>
        </div>
</div>
</body>
</html>
