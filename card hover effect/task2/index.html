<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cards</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="team">

        <div class="team-card">
            <div class="info">
                <h3>Karan Singh</h3>
                <p>Graphic Designer</p>
            </div>
            <div class="image">
                <img src="image1.jpg.jpg" alt="Person 1">
            </div>
        </div>

        <div class="team-card">
            <div class="info">
                <h3>Dolly Seth</h3>
                <p>Digital marketing</p>
            </div>
            <div class="image">
                <img src="image2.jpg.jpg" alt="Person 2">
            </div>
        </div>

        <div class="team-card">
            <div class="info">
                <h3>Aakash Agrawal</h3>
                <p>Chartered Accountant C.A</p>
            </div>
            <div class="image">
                <img src="image3.jpg.jpg" alt="Person 3">
            </div>
        </div>

    </section>

</body>
</html>
