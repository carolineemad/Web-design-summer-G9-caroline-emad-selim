<!DOCTYPE html>
<html>
    <head>
        <title>Employee Details</title>
        <style>
            label{
                display: block;
            }
            input[type="text"],
           input[type="file"],
           input[type="date"],
           input[type="range"],
textarea{
    display: block;
}
        </style>
    </head>
    <body>
        <form autocomplete="off">
            <fieldset>
                <legend>Employee Details</legend>
                <label>First Name:</label>
                <input type="text" name="fname" required pattern="[A-Za-z]+">
                <label>Last Name:</label>
                <input type="text" name="lname" minlength="5">
                <label>Mobile:</label>
                <input type="text" name="Mobile" pattern="(010|011|012|015)[0-9]{8}" required>
                <label>Courses</label>
                <input type="text" name="courses" list="courseList">
                <datalist id="courseList">
                    <option value="Java Script"></option>
                        <option value="CSS"></option>
                        <option value="HTML"></option>
                        <option value="Python"></option>
                </datalist>
                <label>Upload Image:</label>
                <input type="file" name="image" accept=".png">
                <label>Date Of Birth:</label>
                <input type="date" name="birthdate" required>
                <div>
                <input type="radio" name="gender" value="Male" required>Male
                <input type="radio" name="gender" value="Female">Female
                </div>
                <fieldset>
                    <legend>Tracks</legend>
                <label class="track-label"><input type="checkbox" name="tracks" value="Frontend" checked>Frontend</label>
                <label class="track-label"><input type="checkbox" name="tracks" value="Backend">Backend</label>
                <label class="track-label"><input type="checkbox" name="tracks" value="Web design">Web design</label>
                </fieldset>
                <label>Level:</label>
                10<input type="range" name="level" min="10" max="100" id="LevelRange">100
                <label>Comment:</label>
                <textarea name="comment" required></textarea>
                <input type="submit" value="Submit">
            </fieldset>
        </form>
    </body>
</html>
